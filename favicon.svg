<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="icyhoty2k">
  <!-- The mark on its own dark plate, for the browser tab. Same geometry as
       assets/mark.svg; the plate exists because a tab favicon has no page
       behind it and a bare white stem vanishes on a light-themed browser. -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <defs>
    <clipPath id="stem">
      <path d="M225.8,222.4 H286.2 V370.3 A30.2,30.2 0 0 1 225.8,370.3 Z"/>
    </clipPath>
  </defs>
  <path d="M225.8,222.4 H286.2 V370.3 A30.2,30.2 0 0 1 225.8,370.3 Z" fill="#f8fafc"/>
  <rect x="220" y="334.6" width="76" height="80" fill="#38bdf8" clip-path="url(#stem)"/>
  <circle cx="256" cy="151.8" r="33.6" fill="#38bdf8"/>
</svg>
